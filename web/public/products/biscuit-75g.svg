<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <rect width="200" height="150" fill="#F8FAFC" rx="10"/>
  <!-- Biscuit 75g Pack Body (larger, centered, 4:3) -->
