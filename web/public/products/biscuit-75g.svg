  <circle cx="100" cy="75" r="2.5" fill="#FEF3C7"/>
  <circle cx="118" cy="75" r="2.5" fill="#FEF3C7"/>
  <circle cx="82" cy="88" r="2.5" fill="#FEF3C7"/>
  <circle cx="100" cy="88" r="2.5" fill="#FEF3C7"/>
  <circle cx="118" cy="88" r="2.5" fill="#FEF3C7"/>
</svg>