  <rect x="31" y="36" width="138" height="78" rx="6" fill="#FBBF24"/>
  <!-- Pack crimp edges -->
  <line x1="33" y1="40" x2="33" y2="110" stroke="#B45309" stroke-width="2.5" stroke-dasharray="3 3"/>
  <line x1="167" y1="40" x2="167" y2="110" stroke="#B45309" stroke-width="2.5" stroke-dasharray="3 3"/>
  <!-- Biscuit Cookie Emblem -->
