<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <rect width="200" height="150" fill="#F8FAFC" rx="10"/>
  <!-- Detergent 500g Pillow Refill Sachet (visibly squarer shape, distinct from 1kg standup pouch) -->
  <!-- Top crimped seal -->
  <rect x="45" y="24" width="110" height="10" rx="1.5" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5"/>
  <line x1="48" y1="29" x2="152" y2="29" stroke="#93C5FD" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- Sachet main body (pillowy rectangular cushion) -->
  <rect x="45" y="34" width="110" height="82" rx="4" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="50" y="39" width="100" height="72" rx="3" fill="#3B82F6"/>
  <!-- Bottom crimped seal -->
  <rect x="45" y="116" width="110" height="10" rx="1.5" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5"/>
  <line x1="48" y1="121" x2="152" y2="121" stroke="#93C5FD" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- Decorative bubbles & splash -->
  <circle cx="85" cy="72" r="14" fill="#93C5FD" opacity="0.85"/>
  <circle cx="118" cy="66" r="10" fill="#BFDBFE" opacity="0.9"/>
  <circle cx="112" cy="88" r="8" fill="#DBEAFE" opacity="0.95"/>
  <!-- Center gleam star -->
  <path d="M100 48 L102 55 L109 57 L102 59 L100 66 L98 59 L91 57 L98 55 Z" fill="#FFFFFF"/>
</svg>
